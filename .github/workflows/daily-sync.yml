name: Daily Upstream Sync

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

env:
  TZ: Asia/Shanghai

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/immortalwrt/immortalwrt.git 2>/dev/null || true
          git fetch upstream

      - name: Merge upstream master
        run: |
          set +e
          git merge upstream/master --no-edit --allow-unrelated-histories
          MERGE_EXIT=$?
          if [ $MERGE_EXIT -ne 0 ]; then
            echo "Merge failed (exit $MERGE_EXIT), checking for conflicts..."
            if git ls-files -u | grep -q feeds.conf.default; then
              echo "Resolving feeds.conf.default conflict..."
              git checkout --theirs feeds.conf.default
              printf 'src-git zuoxm https://github.com/zxmlysxl/zxm_immortalwrt_packages.git\nsrc-git packages https://github.com/zxmlysxl/immortalwrt_packages.git\nsrc-git luci https://github.com/zxmlysxl/zxm_immortalwrt_luci.git\n' > feeds.conf.default
              git add feeds.conf.default
              git commit --no-edit
            fi
            if ! git merge-head --quiet 2>/dev/null; then
              git merge --abort 2>/dev/null || true
              echo "::notice::Merge conflict could not be resolved, skipping sync"
              exit 0
            fi
          fi

      - name: Apply IP/hostname patches
        run: |
          sed -i 's/192\.168\.1\.1/192.168.32.10/g' package/base-files/files/bin/config_generate 2>/dev/null || true
          sed -i 's/TIMEZONE=.*/TIMEZONE=Asia\/Shanghai/g' package/base-files/files/bin/config_generate 2>/dev/null || true
          sed -i 's/hostname="ImmortalWrt"/hostname="ZUOXM"/g' package/base-files/files/bin/config_generate 2>/dev/null || true

      - name: Check for changes
        id: changed
        run: |
          git status --porcelain > changes.txt
          if [ -s changes.txt ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.changed.outputs.changed == 'true'
        run: |
          git add -A
          git commit -m "chore: sync with upstream $(date +%Y-%m-%d)"
          git push origin master
          echo "::notice::Upstream sync committed and pushed"
