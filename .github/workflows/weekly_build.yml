name: Build ImmortalWrt x86_64

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      skip_sync:
        description: 'Skip upstream sync (use cached source)'
        required: false
        default: 'false'
        type: boolean
      retry_count:
        description: 'Retry count (auto-set, do not manually set)'
        required: false
        default: '0'
        type: string

env:
  TZ: Asia/Shanghai

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Configure git
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git remote add upstream https://github.com/immortalwrt/immortalwrt.git || true

      # ========== Clean broken patches (always run, even with skip_sync) ==========
      # Upstream keeps re-adding realtek PHY patches that target Linux 6.19+
      # and fail on our Linux 6.18.52 kernel headers. Remove them unconditionally.
      - name: Clean broken patches
        run: |
          echo "=== Cleaning broken realtek PHY patches ==="
          # pending-6.18: all realtek PHY patches (720/721/722/742/743 series)
          rm -f target/linux/generic/pending-6.18/720-*.patch
          rm -f target/linux/generic/pending-6.18/721-*.patch
          rm -f target/linux/generic/pending-6.18/722-*.patch
          rm -f target/linux/generic/pending-6.18/742-*.patch
          rm -f target/linux/generic/pending-6.18/743-*.patch
          # backport-6.18: realtek PHY patches (784/788-800/941-944 series)
          rm -f target/linux/generic/backport-6.18/784-*.patch
          rm -f target/linux/generic/backport-6.18/788-*.patch
          rm -f target/linux/generic/backport-6.18/789-*.patch
          rm -f target/linux/generic/backport-6.18/790-*.patch
          rm -f target/linux/generic/backport-6.18/791-*.patch
          rm -f target/linux/generic/backport-6.18/792-*.patch
          rm -f target/linux/generic/backport-6.18/793-*.patch
          rm -f target/linux/generic/backport-6.18/794-*.patch
          rm -f target/linux/generic/backport-6.18/795-*.patch
          rm -f target/linux/generic/backport-6.18/796-*.patch
          rm -f target/linux/generic/backport-6.18/797-*.patch
          rm -f target/linux/generic/backport-6.18/798-*.patch
          rm -f target/linux/generic/backport-6.18/799-*.patch
          rm -f target/linux/generic/backport-6.18/800-*.patch
          # backport-6.18: mt7530 EEE patch incompatible with Linux 6.18.54
          rm -f target/linux/generic/backport-6.18/946-*.patch
          rm -f target/linux/generic/backport-6.18/941-*.patch
          rm -f target/linux/generic/backport-6.18/942-*.patch
          rm -f target/linux/generic/backport-6.18/943-*.patch
          rm -f target/linux/generic/backport-6.18/944-*.patch
          # hack-6.18: realtek PHY patches
          rm -f target/linux/generic/hack-6.18/750-net-phy-realtek-add-rtl8261c-led-support.patch
          # hack-6.18: serial 8250 UPIO_AU duplicate (upstream 6.18.54 already includes it)
          rm -f target/linux/generic/hack-6.18/890-serial-8250-add-UPIO_AU-case-to-set_io_from_upio.patch
          # backport-6.18: MHI pci_generic patch incompatible with Linux 6.18.54
          rm -f target/linux/generic/backport-6.18/706-v7.2-bus-mhi-host-pci_generic-round-up-nr_irqs-to-a-power-of-two.patch
          # mediatek: realtek PHY patch targeting Linux 6.19+ kernel headers (upstream re-adds it on every sync)
          rm -f target/linux/mediatek/patches-6.18/733-net-phy-realtek-support-LED-polarity-on-RTL8221B.patch
          # Stage deletions
          git add -u target/linux/generic/backport-6.18/ target/linux/generic/pending-6.18/ target/linux/generic/hack-6.18/ target/linux/mediatek/patches-6.18/
          git diff --cached --quiet || git commit -m "chore: drop broken realtek PHY patches" --allow-empty 2>/dev/null || true
          echo "=== Patch cleanup done ==="

      # ========== Sync upstream ==========
      - name: Sync upstream
        if: inputs.skip_sync != 'true'
        run: |
          echo "=== Syncing upstream ==="
          git fetch upstream master --depth=1
          git merge upstream/master --no-edit --allow-unrelated-histories || {
            for f in $(git diff --name-only --diff-filter=U 2>/dev/null); do
              echo "Resolving conflict in: $f"
              case "$f" in
                feeds.conf.default)
                  git show upstream/master:feeds.conf.default > feeds.conf.default.tmp
                  echo "src-git zuoxm https://github.com/zxmlysxl/zxm_immortalwrt_packages.git" > feeds.conf.default
                  grep -v "^src-git zuoxm" feeds.conf.default.tmp >> feeds.conf.default
                  rm -f feeds.conf.default.tmp
                  git add feeds.conf.default
                  ;;
                package/base-files/files/bin/config_generate)
                  git checkout --ours "$f"
                  git add "$f"
                  ;;
                *)
                  git checkout --theirs "$f"
                  git add "$f"
                  ;;
              esac
            done
            git commit --no-edit --allow-empty
          }
          echo "=== Sync complete ==="
          git log --oneline -3
          # Re-clean after sync in case upstream re-introduced any patches
          rm -f target/linux/generic/pending-6.18/720-*.patch
          rm -f target/linux/generic/pending-6.18/721-*.patch
          rm -f target/linux/generic/pending-6.18/722-*.patch
          rm -f target/linux/generic/pending-6.18/742-*.patch
          rm -f target/linux/generic/pending-6.18/743-*.patch
          rm -f target/linux/generic/backport-6.18/784-*.patch
          rm -f target/linux/generic/backport-6.18/788-*.patch
          rm -f target/linux/generic/backport-6.18/789-*.patch
          rm -f target/linux/generic/backport-6.18/790-*.patch
          rm -f target/linux/generic/backport-6.18/791-*.patch
          rm -f target/linux/generic/backport-6.18/792-*.patch
          rm -f target/linux/generic/backport-6.18/793-*.patch
          rm -f target/linux/generic/backport-6.18/794-*.patch
          rm -f target/linux/generic/backport-6.18/795-*.patch
          rm -f target/linux/generic/backport-6.18/796-*.patch
          rm -f target/linux/generic/backport-6.18/797-*.patch
          rm -f target/linux/generic/backport-6.18/798-*.patch
          rm -f target/linux/generic/backport-6.18/799-*.patch
          rm -f target/linux/generic/backport-6.18/800-*.patch
          # backport-6.18: mt7530 EEE patch incompatible with Linux 6.18.54
          rm -f target/linux/generic/backport-6.18/946-*.patch
          rm -f target/linux/generic/backport-6.18/941-*.patch
          rm -f target/linux/generic/backport-6.18/942-*.patch
          rm -f target/linux/generic/backport-6.18/943-*.patch
          rm -f target/linux/generic/backport-6.18/944-*.patch
          # hack-6.18: realtek PHY patches
          rm -f target/linux/generic/hack-6.18/750-net-phy-realtek-add-rtl8261c-led-support.patch
          # hack-6.18: serial 8250 UPIO_AU duplicate (upstream 6.18.54 already includes it)
          rm -f target/linux/generic/hack-6.18/890-serial-8250-add-UPIO_AU-case-to-set_io_from_upio.patch
          # backport-6.18: MHI pci_generic patch incompatible with Linux 6.18.54
          rm -f target/linux/generic/backport-6.18/706-v7.2-bus-mhi-host-pci_generic-round-up-nr_irqs-to-a-power-of-two.patch
          # mediatek: realtek PHY patch targeting Linux 6.19+ kernel headers (upstream re-adds it on every sync)
          rm -f target/linux/mediatek/patches-6.18/733-net-phy-realtek-support-LED-polarity-on-RTL8221B.patch
          git add -u target/linux/generic/backport-6.18/ target/linux/generic/pending-6.18/ target/linux/generic/hack-6.18/ target/linux/mediatek/patches-6.18/
          git diff --cached --quiet || git commit -m "chore: drop broken realtek PHY patches and MHI patch (re-applied by upstream sync)" --allow-empty 2>/dev/null || true

      # ========== Apply source patches (IP, hostname, timezone) ==========
      - name: Apply source patches
        run: |
          echo "=== Applying source patches ==="
          sed -i 's/192\.168\.1\.1/192.168.32.10/g' package/base-files/files/bin/config_generate
          sed -i "s/hostname='ImmortalWrt'/hostname='Z-ImmWrt'/g" package/base-files/files/bin/config_generate
          sed -i "s/timezone='GMT0'/timezone='CST-8'/g" package/base-files/files/bin/config_generate
          sed -i "s/zonename='UTC'/zonename='Asia\/Shanghai'/g" package/base-files/files/bin/config_generate
          grep -q "192.168.32.10" package/base-files/files/bin/config_generate && \
          grep -q "Z-ImmWrt" package/base-files/files/bin/config_generate && \
          grep -q "Asia/Shanghai" package/base-files/files/bin/config_generate && \
          echo "✅ Source patches applied" || { echo "❌ Patch failed"; exit 1; }

      # ========== Prepare feeds ==========
      - name: Prepare feeds
        run: |
          echo "=== Updating feeds ==="
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          ./scripts/feeds install -a -p zuoxm -f 2>/dev/null || true

      # ========== Install required tools ==========
      - name: Install build tools
        run: |
          echo "=== Installing required tools ==="
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-utils genisoimage parted dosfstools

      # ========== Copy overlay files ==========
      - name: Copy overlay files
        run: |
          echo "=== Copying overlay files ==="
          mkdir -p files/etc
          echo "Z-ImmortalWrt $(date +"%Y%m%d%H%I") by zuoxm | R$(date +%y.%m.%d)" > files/etc/compile_info
          echo "✅ Overlay files ready"

      # ========== Copy .config ==========
      - name: Copy .config
        run: |
          echo "=== Copying .config ==="
          if [ -f .config ]; then
            echo "✅ .config ready ($(wc -l < .config) lines)"
          else
            echo "❌ .config not found!"
            exit 1
          fi

      # ========== Configure build ==========
      - name: Configure build
        run: |
          # 清空旧的 .config，让 defconfig 基于当前 feeds 完全重新生成
          # 解决 feeds 更新后旧配置与新包产生的循环依赖（mihomo-alpha ↔ mihomo-meta 等）
          > .config
          make defconfig
          # 追加必要的自定义配置
          echo "CONFIG_GOLANG_MOD_CACHE_WORLD_READABLE=y" >> .config
          # 解决 .config 递归依赖错误（defconfig 后新增选项会导致 oldconfig 需要交互）
          # 用 yes "" | oldconfig 自动接受默认值，一路回车即可
          yes "" | make oldconfig
          # 注入编译时间戳（在 make defconfig 之后，覆盖其重置的值）
          sed -i "s/__BUILD_TIME__/$(date +\"%Y%m%d%H%M\")/g" .config
          echo "✅ Configuration complete (VERSION_NUMBER injected)"

      # ========== Download sources ==========
      - name: Download sources
        run: |
          echo "=== Downloading sources ==="
          make download -j$(nproc)

      # ========== Patch 10_system.js ==========
      - name: Patch 10_system.js
        run: |
          echo "=== Patching 10_system.js ==="
          mkdir -p feeds/luci/modules/luci-mod-status/htdocs/luci-static/resources/view/status/include
          cp files/10_system.js feeds/luci/modules/luci-mod-status/htdocs/luci-static/resources/view/status/include/10_system.js
          echo "✅ 10_system.js patched"

      # ========== Fix znetcontrol Makefile (gmake 4.4+ strictness + Build/Prepare bug) ==========
      - name: Fix znetcontrol Makefile
        run: |
          echo "=== Fixing luci-app-znetcontrol/Makefile ==="
          MAKEFILE="feeds/zuoxm/luci-app-znetcontrol/Makefile"
          if [ -f "$MAKEFILE" ]; then
            python3 .github/workflows/scripts/fix-znetcontrol.py
            echo "✅ $MAKEFILE fixed"
          else
            echo "⚠️ $MAKEFILE not found, skipping"
          fi



      # ========== Compile firmware ==========

      - name: Compile firmware
        id: compile
        run: |
          echo "=== Compiling firmware (x86_64 EFI, parallel=\$(nproc)) ==="
          make -j$(nproc) V=s 2>&1 | tee build.log
          BUILD_STATUS=${PIPESTATUS[0]}
          if [ $BUILD_STATUS -ne 0 ]; then
            echo "=== Retry with -j8 ==="
            make clean >/dev/null 2>&1 || true
            make -j8 V=s 2>&1 | tee -a build.log
            BUILD_STATUS=${PIPESTATUS[0]}
          fi
          if [ $BUILD_STATUS -ne 0 ]; then
            echo "=== Retry with single thread ==="
            make clean >/dev/null 2>&1 || true
            make -j1 V=s 2>&1 | tee -a build.log
            BUILD_STATUS=${PIPESTATUS[0]}
          fi
          if [ $BUILD_STATUS -ne 0 ]; then
            echo "=== Build failed, last 50 lines: ==="
            tail -50 build.log
            echo "::notice::Build failed with exit code $BUILD_STATUS"
            exit 1
          fi
          echo "✅ Build complete"

      # ========== Find & rename firmware ==========
      - name: Find and rename firmware
        id: firmware
        run: |
          cd bin/targets/x86/64
          BUILD_DATE=$(date +"%Y%m%d")
          FIRMWARE=$(ls -t *-efi.img.gz 2>/dev/null | grep -v "^Z-ImmWrt" | head -1)
          if [ -z "$FIRMWARE" ]; then
            FIRMWARE=$(ls -t *.img.gz 2>/dev/null | head -1)
          fi
          NEW_NAME="Z-ImmWrt-${BUILD_DATE}-zuoxm-x86_64-efi.img.gz"
          mv "$FIRMWARE" "$NEW_NAME"
          SIZE=$(du -h "$NEW_NAME" | cut -f1)
          SHA256=$(sha256sum "$NEW_NAME" | cut -d' ' -f1)
          echo "firmware=$NEW_NAME" >> $GITHUB_OUTPUT
          echo "size=$SIZE" >> $GITHUB_OUTPUT
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT
          echo "build_date=$BUILD_DATE" >> $GITHUB_OUTPUT
          echo "=== $NEW_NAME ($SIZE) ==="
          ls -lh "$NEW_NAME"

      # ========== Cleanup previous failed tag (if any) ==========
      - name: Cleanup previous tag
        run: |
          TAG="Z-ImmWrt-${{ steps.firmware.outputs.build_date }}"
          if git tag | grep -q "^$TAG$"; then
            git tag -d "$TAG"
            git push origin :refs/tags/"$TAG" || true
            echo "🗑 Removed stale tag: $TAG"
          else
            echo "ℹ No stale tag found: $TAG"
          fi

      # ========== Create release ==========
      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: Z-ImmWrt-${{ steps.firmware.outputs.build_date }}
          name: Z-ImmWrt-${{ steps.firmware.outputs.build_date }} by zuoxm
          draft: false
          prerelease: false
          files: bin/targets/x86/64/Z-ImmWrt-*.img.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ========== Summary ==========
      - name: Summary
        run: |
          echo "## ✅ Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Firmware | Z-ImmWrt-${{ steps.firmware.outputs.build_date }}-zuoxm-x86_64-efi.img.gz |" >> $GITHUB_STEP_SUMMARY
          echo "| Size | ${{ steps.firmware.outputs.size }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SHA256 | \`${{ steps.firmware.outputs.sha256 }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`$(git log --oneline -1)\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Retry count | ${{ inputs.retry_count || '0' }} |" >> $GITHUB_STEP_SUMMARY

  # ========== Auto-retry on failure ==========
  retry:
    needs: build
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Trigger retry with cached sources
        run: |
          NEXT=$(( ${{ inputs.retry_count || '0' }} + 1 ))
          echo "🔁 Retrying (attempt $NEXT) with cached sources..."
          gh workflow run weekly_build.yml \
            -f skip_sync=true \
            -f retry_count=${NEXT} \
            --ref master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
